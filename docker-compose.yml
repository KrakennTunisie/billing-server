services:
  billing-server:
    build:
      context: .
    container_name: billing-server
    ports:
      - "8081:8081"
    depends_on:
      billing-db:
        condition: service_started
    restart: unless-stopped
    volumes:
      - billing_storage:/app/storage
    networks:
      - ms-net
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EXCHANGERATE: ${EXCHANGERATE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
  billing-db:
    image: postgres:18
    container_name: billing-db
    environment:
      POSTGRES_DB: billing_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - billing_db_data:/var/lib/postgresql
    networks:
      - ms-net

volumes:
  billing_db_data:
  billing_storage:

networks:
  ms-net:
    external: true